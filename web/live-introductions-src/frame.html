<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <link rel="stylesheet" href="../app.css">
</head>
<body class="frame-page" data-frame-id="{{FRAME_ID}}">
  <a class="skip-link" href="#main-content">Skip to frame content</a>
  <header class="site-header">
    <p class="brand">{{SHELL_TITLE}}</p>
    <div class="study-markers" aria-label="Prototype status">
      <strong>SYNTHETIC / FICTIONAL</strong>
      <span>WIREFRAME ONLY</span>
    </div>
    {{SHELL_CONTROLS}}
  </header>
  <nav class="frame-navigation" aria-label="Frame navigation">
    {{FRAME_NAVIGATION}}
  </nav>
  <main id="main-content" tabindex="-1">
    {{FRAME_INTERFACE}}
    {{FRAME_CONTRACT}}
  </main>
  <footer>
    {{REVIEW_LINKS}}
  </footer>
</body>
</html>
