name: CI

on:
  push:
    branches: [main, feat/**, agent/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format sources and capture patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff -- . > rustfmt.patch
          if [[ -s rustfmt.patch ]]; then
            echo "Rust formatting changes are required:"
            cat rustfmt.patch
          else
            echo "Rust formatting is clean."
          fi
      - name: Upload rustfmt patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch-${{ github.sha }}
          path: rustfmt.patch
          if-no-files-found: ignore
          retention-days: 7
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Upload Clippy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log-${{ github.sha }}
          path: clippy.log
          if-no-files-found: error
          retention-days: 7
      - name: Unit and integration tests
        run: cargo test --workspace
      - name: Alignment tests
        run: cargo test -p dating-matching alignment -- --nocapture
      - name: Preference tests
        run: cargo test -p dating-matching preferences -- --nocapture
      - name: Proximity tests
        run: cargo test -p dating-matching proximity -- --nocapture
      - name: Location grant tests
        run: cargo test -p dating-matching location_share -- --nocapture
      - name: Anti-abuse tests
        run: cargo test -p dating-safety anti_abuse -- --nocapture
      - name: Skin Shop boundary tests
        run: cargo test -p dating-profile skin_shop -- --nocapture
      - name: Enforce committed Rust formatting
        shell: bash
        run: test ! -s rustfmt.patch

  questionnaire-and-governance:
    name: Questionnaire / governance contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate questionnaire JSON
        run: python -m json.tool config/alignment-questionnaire-v1.json >/dev/null
      - name: Required adult and consent contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'adults-only' MISSION.md
          grep -Fq 'No person under 18' policies/community-rules.md
          grep -Fq 'Identical privacy defaults for every gender' docs/governance/release-gates.md
          grep -Fq 'Purchases never affect dating rank' docs/governance/release-gates.md
          grep -Fq 'autoMatchOnLike: false' apps/ios/Sources/AppModel.swift
          grep -Fq 'return nil' apps/ios/Sources/AppModel.swift
          test -f apps/ios/Sources/AppModel+AdultEligibility.swift
          test -f core/matching/src/proximity.rs
          test -f core/matching/src/location_share.rs
          test -f core/safety/src/anti_abuse.rs
          test -f core/profile/src/skin_shop.rs
          test -f docs/architecture/adr-0009-consent-based-proximity.md
          test -f docs/architecture/adr-0010-matched-location-sharing.md
          test -f docs/architecture/adr-0011-local-sensitive-alignment.md
          test -f docs/architecture/adr-0012-skin-shop-boundary.md
          test -f docs/architecture/adr-0013-bot-sybil-resistance.md
      - name: Marketplace allowlist excludes executable formats
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Initial denylist:' docs/product/adult-feature-expansion.md
          grep -Fq -- '- JavaScript;' docs/product/adult-feature-expansion.md
          grep -Fq -- '- arbitrary HTML;' docs/product/adult-feature-expansion.md
          grep -Fq -- '- executable plugins;' docs/product/adult-feature-expansion.md
          allowed_block="$(sed -n '/const ALLOWED_SKIN_MIMES/,/];/p' core/profile/src/skin_shop.rs)"
          ! grep -Eiq 'text/html|application/javascript|text/javascript' <<<"$allowed_block"

  command-integrity:
    name: Deploy command integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA-256
        run: bash scripts/command_integrity_check.sh

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Assemble staging app
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify artifact
        run: test -s apps/android/app/build/outputs/apk/debug/app-debug.apk

  ios-swift-package:
    name: iOS Swift source build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift package build
        working-directory: apps/ios
        shell: bash
        run: |
          set -o pipefail
          swift build 2>&1 | tee ../../swift-package-build.log
      - name: Upload Swift package build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-package-build-${{ github.sha }}
          path: swift-package-build.log
          if-no-files-found: error
          retention-days: 7

  ios-xcode:
    name: iOS Simulator Xcode build with UniFFI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build app and linked Rust core
        shell: bash
        run: |
          set -o pipefail
          make ios-build 2>&1 | tee ios-xcode-build.log
      - name: Upload iOS Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build-${{ github.sha }}
          path: ios-xcode-build.log
          if-no-files-found: error
          retention-days: 7

  live-introductions-prototype:
    name: Live Introductions prototype acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned Netlify CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(npx --yes netlify-cli@23.13.0 --version)"
          printf '%s\n' "$version"
          grep -Fq 'netlify-cli/23.13.0' <<<"$version"
      - name: Resolve and validate every Netlify build context
        run: make live-introductions-netlify-validate
      - name: Check canonical hosted Netlify contexts
        shell: bash
        run: |
          set -euo pipefail

          set +e
          preflight_output="$(
            python3 scripts/verify_live_introductions_deploy_context.py \
              --deployment-preflight 2>&1
          )"
          preflight_status=$?
          set -e
          printf '%s\n' "$preflight_output"

          blocker_codes=(
            AWS_IDENTITY_MISSING
            AWS_IDENTITY_MALFORMED
            AWS_IDENTITY_UNVERIFIED
            NETLIFY_IDENTITY_MISSING
            NETLIFY_IDENTITY_MALFORMED
            NETLIFY_IDENTITY_UNVERIFIED
          )
          matched_blockers=0

          for context in deploy-preview branch-deploy; do
            if [[ $preflight_status -eq 0 ]]; then
              npx --yes netlify-cli@23.13.0 build --context "$context" --offline
              continue
            fi

            set +e
            hosted_output="$(
              npx --yes netlify-cli@23.13.0 build --context "$context" --offline 2>&1
            )"
            hosted_status=$?
            set -e
            printf '%s\n' "$hosted_output"
            if [[ $hosted_status -eq 0 ]]; then
              echo "ERROR: hosted context ignored canonical preflight: $context"
              exit 1
            fi

            context_matched=0
            for code in "${blocker_codes[@]}"; do
              if grep -Fq "$code" <<<"$preflight_output"; then
                grep -Fq "$code" <<<"$hosted_output"
                context_matched=$((context_matched + 1))
                matched_blockers=$((matched_blockers + 1))
              fi
            done
            if [[ $context_matched -eq 0 ]]; then
              echo "ERROR: preflight failed without a parsed identity blocker"
              exit 1
            fi
          done

          if [[ $preflight_status -ne 0 && $matched_blockers -eq 0 ]]; then
            echo "ERROR: no canonical blocker was exercised"
            exit 1
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: '0.11.31'
          enable-cache: true
          cache-dependency-glob: tools/live-introductions-browser/uv.lock
      - name: Prototype unit and structural tests
        run: make live-introductions-test
      - name: Prototype static build
        run: make live-introductions-build
      - name: Install isolated Chromium
        run: uv run --project tools/live-introductions-browser --frozen playwright install --with-deps chromium
      - name: Prototype browser acceptance
        run: make live-introductions-browser

  production-gate:
    name: Production preflight (must fail without approvals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: production-preflight must block
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(bash scripts/production_preflight.sh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ $status -eq 0 ]]; then
            echo "ERROR: production-preflight should have blocked"
            exit 1
          fi
          grep -Fq 'PRODUCTION_BLOCKED_HUMAN_APPROVALS_REQUIRED' <<<"$output"
          echo "OK: production remains human-gated"
